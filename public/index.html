<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenSkills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <div class="brand-text">
        <div class="brand-name">ZenSkills</div>
        <div class="brand-tagline">If you don't use it, you will lose it</div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-tab="dashboard">
        <span class="nav-dot"></span> Tableau de bord
      </button>
      <button class="nav-item" data-tab="cours">
        <span class="nav-dot"></span> Cours
      </button>
      <button class="nav-item" data-tab="parcours">
        <span class="nav-dot"></span> Parcours
      </button>
      <button class="nav-item" data-tab="competences">
        <span class="nav-dot"></span> Compétences
      </button>
      <button class="nav-item" data-tab="projets">
        <span class="nav-dot"></span> Projets
      </button>
      <button class="nav-item" data-tab="taches">
        <span class="nav-dot"></span> Tâches
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user"></div>
      <a class="btn btn-sm" id="btn-export" href="/api/export">⇩ Exporter (.xlsx)</a>
      <button class="btn btn-sm" id="btn-import">⇧ Importer (.xlsx)</button>
      <input type="file" id="import-file-input" accept=".xlsx" hidden>
      <button class="btn btn-sm btn-logout" id="btn-logout">Se déconnecter</button>
    </div>
  </aside>

  <main class="content">

    <!-- DASHBOARD -->
    <section class="tab-panel active" id="tab-dashboard">
      <div class="quote-block">
        <div class="quote-stroke"></div>
        <blockquote class="quote-text">
          Pourtant comprenez bien que rien au monde, ou presque, ne résiste à la persévérance de l'énergie humaine.
        </blockquote>
        <div class="quote-author">— Robert Greene</div>
      </div>

      <div class="stats-grid" id="stats-grid"></div>

      <div class="dashboard-columns">
        <div class="dashboard-panel">
          <div class="panel-title">À revoir</div>
          <div id="dashboard-a-revoir" class="dashboard-a-revoir-list"></div>
        </div>
        <div class="dashboard-panel">
          <div class="panel-title">Compétences acquises</div>
          <div id="dashboard-competences" class="tag-row dashboard-competences"></div>
        </div>
      </div>

      <div class="dashboard-panel dashboard-panel-full">
        <div class="panel-title">Parcours</div>
        <div id="dashboard-parcours" class="dashboard-parcours-list"></div>
      </div>
    </section>

    <!-- COURS -->
    <section class="tab-panel" id="tab-cours">
      <div class="panel-header">
        <h1>Cours</h1>
        <button class="btn btn-primary" id="btn-new-cours">+ Nouveau cours</button>
      </div>
      <div class="toolbar">
        <input type="text" class="search-input" id="search-cours" placeholder="Rechercher un cours…">
        <select id="filter-cours-statut" class="filter-select">
          <option value="">Statut : tous</option>
          <option value="1">Terminé</option>
          <option value="0">Non terminé</option>
        </select>
        <select id="filter-cours-type" class="filter-select">
          <option value="">Type : tous</option>
          <option value="Obligatoire">Obligatoire</option>
          <option value="Optionnel">Optionnel</option>
        </select>
        <select id="filter-cours-categorie" class="filter-select">
          <option value="">Catégorie : toutes</option>
        </select>
        <select id="filter-cours-format" class="filter-select">
          <option value="">Format : tous</option>
        </select>
        <select id="filter-cours-niveau" class="filter-select">
          <option value="">Niveau : tous</option>
          <option value="1">★☆☆☆☆</option>
          <option value="2">★★☆☆☆</option>
          <option value="3">★★★☆☆</option>
          <option value="4">★★★★☆</option>
          <option value="5">★★★★★</option>
        </select>
        <select id="filter-cours-competence" class="filter-select">
          <option value="">Compétence : toutes</option>
        </select>
      </div>
      <div class="list" id="list-cours"></div>
      <div class="pagination" id="pagination-cours"></div>
    </section>

    <!-- PARCOURS -->
    <section class="tab-panel" id="tab-parcours">
      <div class="panel-header">
        <h1>Parcours</h1>
        <button class="btn btn-primary" id="btn-new-parcours">+ Nouveau parcours</button>
      </div>
      <div class="toolbar">
        <input type="text" class="search-input" id="search-parcours" placeholder="Rechercher un parcours…">
        <select id="filter-parcours-statut" class="filter-select">
          <option value="">Statut : tous</option>
          <option value="1">Terminé</option>
          <option value="0">Non terminé</option>
        </select>
      </div>
      <div class="list" id="list-parcours"></div>
      <div class="pagination" id="pagination-parcours"></div>
    </section>

    <!-- COMPETENCES -->
    <section class="tab-panel" id="tab-competences">
      <div class="panel-header">
        <h1>Compétences</h1>
        <button class="btn btn-primary" id="btn-new-competence">+ Nouvelle compétence</button>
      </div>
      <div class="toolbar">
        <input type="text" class="search-input" id="search-competences" placeholder="Rechercher une compétence…">
        <select id="filter-competences-cours" class="filter-select">
          <option value="">Cours : tous</option>
        </select>
      </div>
      <div class="list" id="list-competences"></div>
      <div class="pagination" id="pagination-competences"></div>
    </section>

    <!-- PROJETS -->
    <section class="tab-panel" id="tab-projets">
      <div class="panel-header">
        <h1>Projets</h1>
        <button class="btn btn-primary" id="btn-new-projet">+ Nouveau projet</button>
      </div>
      <div class="toolbar">
        <input type="text" class="search-input" id="search-projets" placeholder="Rechercher un projet…">
        <select id="filter-projets-statut" class="filter-select">
          <option value="">Statut : tous</option>
          <option value="1">Terminé</option>
          <option value="0">Non terminé</option>
        </select>
      </div>
      <div class="list" id="list-projets"></div>
      <div class="pagination" id="pagination-projets"></div>
    </section>

    <!-- TACHES -->
    <section class="tab-panel" id="tab-taches">
      <div class="panel-header">
        <h1>Tâches</h1>
        <button class="btn btn-primary" id="btn-new-tache">+ Nouvelle tâche</button>
      </div>
      <div class="toolbar">
        <input type="text" class="search-input" id="search-taches" placeholder="Rechercher une tâche…">
        <select id="filter-taches-statut" class="filter-select">
          <option value="">Statut : toutes</option>
          <option value="0">À faire</option>
          <option value="1">Faite</option>
        </select>
      </div>
      <div class="list" id="list-taches"></div>
      <div class="pagination" id="pagination-taches"></div>
    </section>

  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
