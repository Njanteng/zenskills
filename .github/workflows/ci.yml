name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          status=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f" || status=1
          done
          exit $status

      - name: Run tests
        run: npm test

      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=high || true
